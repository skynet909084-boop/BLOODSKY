name: Visual parity — original versus BLOODSKY
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-menu-compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      BLOODSKY_ORIGINAL_APK: ${{ github.workspace }}/.cache/original.apk
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test libraries
        run: python3 -m pip install --disable-pip-version-check pillow
      - name: Prepare Android SDK
        run: |
          test -d "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'build-tools;35.0.0' 'platform-tools'
      - run: bash tools/fetch_pinned_original.sh
      - name: Build hash-checked QA APK
        run: bash tools/build_candidate.sh
      - name: Enable KVM
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-linux-hw-accel: false
          disable-animations: false
          emulator-boot-timeout: 600
          script: bash tests/set_russian_locale.sh && bash tests/compare_original_menu_smoke.sh
      - name: Preserve original-vs-BLOODSKY pixel comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLOODSKY-menu-visual-compare
          path: out/visual/
          if-no-files-found: warn
          retention-days: 7
